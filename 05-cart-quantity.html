<!DOCTYPE html>
<html> 
    <head>
        <title>Cart Quantity</title>
    </head>
    <body>
        <button onclick="
         displayCartQuantity();
        ">Show Quantity</button>

        <button onclick="
         updateCartQuantity(1);
        ">Add to Cart</button>

        <button onclick="
        updateCartQuantity(2);
        ">+2</button>

        <button onclick="
        updateCartQuantity(3);
        ">+3</button>

        <button onclick="
        updateCartQuantity(4);
        ">+4</button>

        <button onclick="
        updateCartQuantity(5);
        ">+5</button>

        <button onclick="
        updateCartQuantity(-1);
        ">Remove From Cart</button>

        <button onclick="
        updateCartQuantity(-2);
        ">-2</button>

        <button onclick="
        updateCartQuantity(-3);
        ">-3</button>

        <button onclick="
        cartQuantity = 0;
        console.log(`Cart was reset!`);
        ">Reset Cart</button>

        <p class="js-quantity"></p>

        <script>
            const product1 = {
                name: 'basketball',
                price: 2095,
                'delivery-time': '3 days'
            };

            const product2 = {
                name: 'baseball',
                price: 1500,
                'delivery-time': '2 days'
            };

            let cartQuantity = 0;
            function updateCartQuantity(change){
                const maxQuantity = 10;
                if(cartQuantity + change > maxQuantity){
                    alert('The cart is full!');
                }else if(cartQuantity + change < 0){
                    alert('Not enough items in the cart.')
                }else{
                    cartQuantity += change;
                    console.log(`Cart Quantity: ${cartQuantity}`);
                }
                displayCartQuantity();
            }
            function displayCartQuantity(){
                document.querySelector('.js-quantity').innerHTML = `Cart Quantity: ${cartQuantity}`;
            }
            function comparePrice(product1, product2){
                if(product1 < product2){
                    return product1;
                }else if(product1 > product2){
                    return product2;
                }else{
                    return 'same price';
                }
            }
            function isSameProduct(product1, product2){
                if(product1 === product2){
                    return true;
                }else{
                    return false;
                }
            }
            
            // Test the functions
            product1.price += 500;
            console.log(product1);
            
            // Step 8c: Add delivery-time using bracket notation
            product1['delivery-time'] = '3 days';
            console.log(product1);
            
            console.log(comparePrice(product1.price, product2.price));
            console.log(isSameProduct(product1.name, product2.name));
            console.log(isSameProduct(product1.price, product2.price));
            
        </script>
    </body>
</html>
