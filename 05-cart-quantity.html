<!DOCTYPE html>
<html> 
    <head>
        <title>Cart Quantity</title>
    </head>
    <body>
        <button onclick="
         console.log(`Cart Quantity: ${cartQuantity}`);
        ">Show Quantity</button>

        <button onclick="
         if(cartQuantity + 1 > maxQuantity){
            alert('The cart is full!');
         }else{
            cartQuantity ++;
            console.log(`Cart Quantity: ${cartQuantity}`);
         }
        ">Add to Cart</button>

        <button onclick="
        if(cartQuantity + 2 > maxQuantity){
            alert('The cart is full!');
        }else{
            cartQuantity += 2;
            console.log(`Cart Quantity: ${cartQuantity}`);
        }
        ">+2</button>

        <button onclick="
        if(cartQuantity + 3 > maxQuantity){
            alert('The cart is full!');
        }else{
            cartQuantity += 3;
            console.log(`Cart Quantity: ${cartQuantity}`);
        }
        ">+3</button>

        <button onclick="
        if(cartQuantity + 4 > maxQuantity){
            alert('The cart is full!');
        }else{
            cartQuantity += 4;
            console.log(`Cart Quantity: ${cartQuantity}`);
        }
        ">+4</button>

        <button onclick="
        if(cartQuantity + 5 > maxQuantity){
            alert('The cart is full!');
        }else{
            cartQuantity += 5;
            console.log(`Cart Quantity: ${cartQuantity}`);
        }
        ">+5</button>

        <button onclick="
        if((cartQuantity--) < 0){
            alert('Not enough items in cart!');
            cartQuantity = 0;
        }else{
            cartQuantity--;
            console.log(`Cart Quantity: ${cartQuantity}`);
        }
        
        ">Remove From Cart</button>

        <button onclick="
        if((cartQuantity -= 2) < 0){
            alert('Not enough items in cart!');
            cartQuantity = 0;
        }else{
            cartQuantity -= 2;
            console.log(`Cart Quantity: ${cartQuantity}`);
        }
        ">-2</button>

        <button onclick="
        if((cartQuantity -= 3) < 0){
            alert('Not enough items in cart!');
            cartQuantity = 0;
        }else{
            cartQuantity -= 3;
            console.log(`Cart Quantity: ${cartQuantity}`);
        }
        ">-3</button>

        <button onclick="
        cartQuantity = 0;
        console.log(`Cart was reset!`);
        ">Reset Cart</button>

        <script>
            let cartQuantity = 0;

            const maxQuantity = 10;
        </script>
    </body>
</html>
